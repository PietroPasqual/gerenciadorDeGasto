<!doctype html>
<html lang="pt-BR" class="dark" data-tema="rosa">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sem isso o env(safe-area-inset-*) vale 0 no iOS e
         todo o cuidado com o notch e a barra de gestos vira enfeite. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>finZ — planner financeiro pessoal em português</title>
    <meta
      name="description"
      content="Controle mensal, fatura de cartão, parcelas, metas com prazo e comparativo anual. Em reais, em português, com seus dados isolados por RLS no Supabase."
    />
    <link rel="canonical" href="https://finz.app/" />

    <!-- Open Graph e Twitter: sem eles, um link compartilhado no WhatsApp ou
         no Slack aparece como URL crua. A imagem é a mesma marca do app, e não
         uma foto de banco de imagens — não há o que prometer além do produto. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="finZ" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="finZ — planner financeiro pessoal em português" />
    <meta
      property="og:description"
      content="Controle mensal, fatura de cartão, parcelas, metas com prazo e comparativo anual. Seus dados só seus."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="finZ — planner financeiro pessoal" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="finZ — planner financeiro pessoal em português" />
    <meta
      name="twitter:description"
      content="Controle mensal, fatura de cartão, parcelas, metas com prazo e comparativo anual."
    />
    <meta name="twitter:image" content="/og.png" />

    <!-- Ícones: SVG para navegadores modernos, PNG como reserva, e o
         apple-touch-icon que o iOS usa ao "Adicionar à Tela de Início". -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Instalável na tela inicial -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="finZ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Cor da barra do navegador. O valor aqui é só o do primeiro quadro: o
         tema é escolhido DENTRO do app (4 cores x claro/escuro), coisa que o
         prefers-color-scheme não sabe. Quem manda de verdade é o store de
         tema, que reescreve este content ao aplicar (src/store/tema.ts).
         O valor é o --background do escuro, que é o padrão do app e é o mesmo
         nos quatro temas (os blocos .dark[data-tema] só mexem em primary e
         accent). -->
    <meta id="theme-color" name="theme-color" content="#18151E" />

    <!-- Tema antes do primeiro pixel.

         O <html> acima nasce escuro porque escuro é o padrão do app. Mas quem
         escolheu o claro — ou o tema azul — tem essa escolha no localStorage, e
         o store só a aplica quando o pacote JS termina de carregar. Entre uma
         coisa e outra existem quadros pintados com o tema errado: era um flash
         branco antes, e vira um flash preto agora, que é pior, porque agora ele
         cai justamente sobre quem pediu o claro.

         Este script é síncrono e roda antes da primeira pintura, e é o único
         lugar do app que lê a chave do persist do zustand na mão. Ele duplica
         DE PROPÓSITO o que `aplicar()` faz em src/store/tema.ts: para não
         duplicar seria preciso carregar o store aqui, e carregar o store é
         exatamente o que demora.

         Ele não decide nada — só antecipa. Se a leitura falhar (modo privativo
         derruba o localStorage em alguns navegadores), fica o padrão do app e o
         store corrige logo em seguida. -->
    <script>
      ;(function () {
        var escuro = true
        var tema = 'rosa'
        try {
          var bruto = localStorage.getItem('gdg-tema')
          if (bruto) {
            var salvo = JSON.parse(bruto).state || {}
            if (typeof salvo.escuro === 'boolean') escuro = salvo.escuro
            if (typeof salvo.tema === 'string') tema = salvo.tema
          }
        } catch (e) {
          /* sem localStorage: fica o padrão do app */
        }
        var raiz = document.documentElement
        raiz.classList.toggle('dark', escuro)
        raiz.classList.toggle('light', !escuro)
        raiz.setAttribute('data-tema', tema)
      })()
    </script>

    <!-- As fontes agora vêm do próprio domínio, via @fontsource em
         src/index.css. Buscá-las no Google bloqueava o primeiro render e
         deixava o app sem tipografia offline. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
